<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Glow Store - Admin Panel</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        button {
            cursor: pointer;
            border: none;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #111;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginError {
            color: #d00;
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }

        /* =========================
           ADMIN
        ========================= */

        #adminPage {
            display: none;
        }

        .topbar {
            background: white;
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar h1 {
            font-size: 22px;
        }

        .logout-btn {
            background: #eee;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .stat-card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 28px;
        }

        /* =========================
           ORDERS
        ========================= */

        .orders-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            overflow: hidden;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .orders-header input,
        .orders-header select {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .orders-header input {
            width: 250px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 6px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
        }

        .confirmed {
            background: #d1ecf1;
        }

        .processing {
            background: #e2d9f3;
        }

        .shipped {
            background: #cfe2ff;
        }

        .delivered {
            background: #d1e7dd;
        }

        .cancelled {
            background: #f8d7da;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 7px 9px;
            border-radius: 7px;
            font-size: 12px;
        }

        .view-btn {
            background: #eee;
        }

        .delete-btn {
            background: #ffe0e0;
            color: #b00000;
        }

        .status-select {
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: white;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            border-radius: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #eee;
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .detail {
            margin-bottom: 14px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
        }

        .product-item {
            padding: 10px;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 7px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 14px;
            }

            .topbar h1 {
                font-size: 18px;
            }

            .container {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card strong {
                font-size: 22px;
            }

            .orders-header {
                flex-direction: column;
                align-items: stretch;
            }

            .orders-header input {
                width: 100%;
            }

            .orders-box {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<!-- =========================================
     ADMIN LOGIN
========================================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <p>Aura Glow Store</p>

        <div class="input-group">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                autocomplete="email"
            >

        </div>

        <div class="input-group">

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

        </div>

        <button
            class="login-btn"
            id="loginButton"
            onclick="loginAdmin()"
        >
            Login
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- =========================================
     ADMIN DASHBOARD
========================================= -->

<div id="adminPage">

    <div class="topbar">

        <h1>📊 Aura Glow Admin</h1>

        <button
            class="logout-btn"
            onclick="logoutAdmin()"
        >
            Logout
        </button>

    </div>


    <div class="container">

        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">
                <h3>Total Orders</h3>
                <strong id="totalOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <strong id="pendingOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <strong id="confirmedOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Processing</h3>
                <strong id="processingOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Shipped</h3>
                <strong id="shippedOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Delivered</h3>
                <strong id="deliveredOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Cancelled</h3>
                <strong id="cancelledOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Total Sales</h3>
                <strong id="totalSales">Rs. 0</strong>
            </div>

        </div>


        <!-- ORDERS -->

        <div class="orders-box">

            <div class="orders-header">

                <h2>📦 Orders</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search order / customer / phone..."
                    oninput="renderOrders()"
                >

                <select
                    id="statusFilter"
                    onchange="renderOrders()"
                >
                    <option value="All">All Orders</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Order</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="ordersTable">

                        <tr>
                            <td colspan="7" class="loading">
                                Loading orders...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- =========================================
     ORDER DETAILS MODAL
========================================= -->

<div
    class="modal"
    id="orderModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>Order Details</h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="orderDetails"></div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE SETTINGS
========================================= */

// Supabase Project URL
const SUPABASE_URL =
    "https://tmdlhfkggxjexfaumsuq.supabase.co";

// Supabase Publishable Key
const SUPABASE_KEY =
    "sb_publishable_TzeEZkbH1FeNLpSGGafX7g_bMA3GH_F";


/* =========================================
   INITIALIZE SUPABASE
========================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   GLOBAL DATA
========================================= */

let allOrders = [];


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {

            console.error(error);

            showLogin();

            return;
        }

        if (data.session) {

            showAdmin();

        } else {

            showLogin();

        }

    } catch (error) {

        console.error(error);

        showLogin();

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginAdmin() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const errorBox =
        document.getElementById("loginError");

    const loginButton =
        document.getElementById("loginButton");


    errorBox.textContent = "";


    if (!email || !password) {

        errorBox.textContent =
            "Please enter email and password.";

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent = "Logging in...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            console.error(error);

            errorBox.textContent =
                error.message;

            loginButton.disabled = false;

            loginButton.textContent = "Login";

            return;
        }


        if (data && data.session) {

            errorBox.textContent = "";

            await showAdmin();

        } else {

            errorBox.textContent =
                "Login failed. Please try again.";

        }

    } catch (error) {

        console.error(error);

        errorBox.textContent =
            "Something went wrong. Please try again.";

    }


    loginButton.disabled = false;

    loginButton.textContent = "Login";

}


/* =========================================
   LOGOUT
========================================= */

async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    allOrders = [];

    showLogin();

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin() {

    document.getElementById("loginPage")
        .style.display = "flex";

    document.getElementById("adminPage")
        .style.display = "none";

}


/* =========================================
   SHOW ADMIN
========================================= */

async function showAdmin() {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("adminPage")
        .style.display = "block";


    await loadOrders();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

    const table =
        document.getElementById("ordersTable");

    table.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("orders")

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(error);

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Could not load orders.
                    </td>
                </tr>
            `;

            return;
        }


        allOrders = data || [];

        updateDashboard();

        renderOrders();


    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Something went wrong while loading orders.
                </td>
            </tr>
        `;

    }

}


/* =========================================
   UPDATE DASHBOARD
========================================= */

function updateDashboard() {

    document.getElementById("totalOrders")
        .textContent =
        allOrders.length;


    document.getElementById("pendingOrders")
        .textContent =
        countStatus("Pending");


    document.getElementById("confirmedOrders")
        .textContent =
        countStatus("Confirmed");


    document.getElementById("processingOrders")
        .textContent =
        countStatus("Processing");


    document.getElementById("shippedOrders")
        .textContent =
        countStatus("Shipped");


    document.getElementById("deliveredOrders")
        .textContent =
        countStatus("Delivered");


    document.getElementById("cancelledOrders")
        .textContent =
        countStatus("Cancelled");


    const sales =
        allOrders

            .filter(
                order =>
                    order.status !== "Cancelled"
            )

            .reduce(
                (sum, order) =>
                    sum +
                    Number(order.total || 0),

                0
            );


    document.getElementById("totalSales")
        .textContent =
        "Rs. " +
        sales.toLocaleString();

}


/* =========================================
   COUNT STATUS
========================================= */

function countStatus(status) {

    return allOrders.filter(
        order =>
            order.status === status
    ).length;

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders() {

    const table =
        document.getElementById("ordersTable");


    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filter =
        document
            .getElementById("statusFilter")
            .value;


    let orders =
        allOrders.filter(order => {

            const matchesSearch =

                !search ||

                String(order.id)
                    .toLowerCase()
                    .includes(search) ||

                String(order.customer_name || "")
                    .toLowerCase()
                    .includes(search) ||

                String(order.phone || "")
                    .toLowerCase()
                    .includes(search);


            const matchesStatus =

                filter === "All" ||

                order.status === filter;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    if (orders.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No orders found.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        orders.map(order => {

            const date =
                order.created_at
                    ? new Date(
                        order.created_at
                    ).toLocaleString()
                    : "-";


            const status =
                order.status || "Pending";


            const statusClass =
                status.toLowerCase();


            return `

                <tr>

                    <td>
                        <strong>
                            #${order.id}
                        </strong>
                    </td>


                    <td>
                        ${escapeHTML(date)}
                    </td>


                    <td>
                        ${escapeHTML(
                            order.customer_name || "-"
                        )}
                    </td>


                    <td>
                        ${escapeHTML(
                            order.phone || "-"
                        )}
                    </td>


                    <td>
                        Rs.
                        ${Number(
                            order.total || 0
                        ).toLocaleString()}
                    </td>


                    <td>

                        <select
                            class="status-select"
                            onchange="changeStatus(${order.id}, this.value)"
                        >

                            <option
                                value="Pending"
                                ${status === "Pending" ? "selected" : ""}
                            >
                                Pending
                            </option>

                            <option
                                value="Confirmed"
                                ${status === "Confirmed" ? "selected" : ""}
                            >
                                Confirmed
                            </option>

                            <option
                                value="Processing"
                                ${status === "Processing" ? "selected" : ""}
                            >
                                Processing
                            </option>

                            <option
                                value="Shipped"
                                ${status === "Shipped" ? "selected" : ""}
                            >
                                Shipped
                            </option>

                            <option
                                value="Delivered"
                                ${status === "Delivered" ? "selected" : ""}
                            >
                                Delivered
                            </option>

                            <option
                                value="Cancelled"
                                ${status === "Cancelled" ? "selected" : ""}
                            >
                                Cancelled
                            </option>

                        </select>

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="view-btn"
                                onclick="viewOrder(${order.id})"
                            >
                                View
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteOrder(${order.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
    orderId,
    newStatus
) {

    try {

        const {
            error
        } =
            await supabaseClient

                .from("orders")

                .update({
                    status: newStatus
                })

                .eq("id", orderId);


        if (error) {

            console.error(error);

            alert(
                "Could not change order status."
            );

            return;
        }


        const order =
            allOrders.find(
                item =>
                    item.id === orderId
            );


        if (order) {

            order.status =
                newStatus;

        }


        updateDashboard();

        renderOrders();


    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong."
        );

    }

}


/* =========================================
   VIEW ORDER
========================================= */

function viewOrder(orderId) {

    const order =
        allOrders.find(
            item =>
                item.id === orderId
        );


    if (!order) {

        alert("Order not found.");

        return;
    }


    const details =
        document.getElementById(
            "orderDetails"
        );


    let productsHTML = "";


    try {

        let products =
            order.products;


        if (typeof products === "string") {

            products =
                JSON.parse(products);

        }


        if (!Array.isArray(products)) {

            products = [];

        }


        if (products.length === 0) {

            productsHTML =
                `<div class="product-item">
                    No product details available.
                </div>`;

        } else {

            productsHTML =
                products.map(product => {

                    const name =
                        product.name ||
                        product.product_name ||
                        "Product";


                    const quantity =
                        product.quantity ||
                        1;


                    const price =
                        Number(
                            product.price || 0
                        );


                    return `
                        <div class="product-item">

                            <strong>
                                ${escapeHTML(name)}
                            </strong>

                            <div>
                                Quantity:
                                ${quantity}
                            </div>

                            <div>
                                Price:
                                Rs. ${price.toLocaleString()}
                            </div>

                        </div>
                    `;

                }).join("");

        }

    } catch (error) {

        productsHTML =
            `<div class="product-item">
                Product information could not be displayed.
            </div>`;

    }


    details.innerHTML = `

        <div class="detail">

            <strong>Order ID</strong>

            <div>
                #${order.id}
            </div>

        </div>


        <div class="detail">

            <strong>Customer Name</strong>

            <div>
                ${escapeHTML(
                    order.customer_name || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <strong>Phone</strong>

            <div>
                ${escapeHTML(
                    order.phone || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <strong>Address</strong>

            <div>
                ${escapeHTML(
                    order.address || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <strong>Notes</strong>

            <div>
                ${escapeHTML(
                    order.notes || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <strong>Status</strong>

            <div>
                ${escapeHTML(
                    order.status || "Pending"
                )}
            </div>

        </div>


        <div class="detail">

            <strong>Products</strong>

            <div>
                ${productsHTML}
            </div>

        </div>


        <div class="detail">

            <strong>Total</strong>

            <div>
                Rs.
                ${Number(
                    order.total || 0
                ).toLocaleString()}
            </div>

        </div>

    `;


    document.getElementById("orderModal")
        .style.display = "flex";

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal() {

    document.getElementById("orderModal")
        .style.display = "none";

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(orderId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const {
            error
        } =
            await supabaseClient

                .from("orders")

                .delete()

                .eq("id", orderId);


        if (error) {

            console.error(error);

            alert(
                "Could not delete order."
            );

            return;
        }


        allOrders =
            allOrders.filter(
                order =>
                    order.id !== orderId
            );


        updateDashboard();

        renderOrders();


    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong."
        );

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
